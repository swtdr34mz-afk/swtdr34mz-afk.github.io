# Builds and publishes the website.
# Runs on every change to the site, once an hour (to pick up new releases
# of the projects), and by hand: Actions -> "Update website" -> Run workflow.
name: Update website

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      announce:
        description: "Post these projects in Discord again (repo names, comma-separated, e.g. RAND)"
        required: false
        default: ""
      areas:
        description: "Only in these channels (vst, mpc, fm1; comma-separated; empty: all of the project's)"
        required: false
        default: ""

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: What the site showed until now (for the Discord posts)
        # from the previous run's own record (the releases-diff artifact), not from the live site: the site is behind
        # a cache for some minutes, and a run right after another would see the old list and post the same release
        # again. The live site only when there is no such record.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -f old-releases.json
          id=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=releases-diff&per_page=20" \
                 --jq "[.artifacts[] | select(.expired | not) | select(.workflow_run.id != ${{ github.run_id }})] | sort_by(.created_at) | last | .id // empty")
          if [ -n "$id" ] && gh api "repos/${{ github.repository }}/actions/artifacts/$id/zip" > prev.zip 2>/dev/null; then
            mkdir -p prev && unzip -o -q prev.zip -d prev && cp prev/releases.json old-releases.json && echo "old list: artifact $id"
          fi
          [ -s old-releases.json ] || curl -fsSL "https://swtdr34mz-afk.github.io/releases.json?$(date +%s)" -o old-releases.json || rm -f old-releases.json
      - name: Fetch the newest releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 tools/update_releases.py releases.json
      - name: Collect the site
        run: |
          mkdir _site
          cp -r index.html releases.json img _site/
          touch _site/.nojekyll
      - name: Keep both for the announcement
        uses: actions/upload-artifact@v4
        with:
          name: releases-diff
          path: |
            old-releases.json
            releases.json
          if-no-files-found: ignore
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  announce:
    # once the new site is live: new releases into the Discord #announcements channels (tools/announce.py)
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: releases-diff
          path: diff
      - name: Post new releases in Discord
        env:
          DISCORD_WEBHOOK_VST: ${{ secrets.DISCORD_WEBHOOK_VST }}
          DISCORD_WEBHOOK_MPC: ${{ secrets.DISCORD_WEBHOOK_MPC }}
          DISCORD_WEBHOOK_FM1: ${{ secrets.DISCORD_WEBHOOK_FM1 }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          F=""; if [ -n "${{ github.event.inputs.announce }}" ]; then F="--force ${{ github.event.inputs.announce }}"; fi
          if [ -n "${{ github.event.inputs.areas }}" ]; then F="$F --only ${{ github.event.inputs.areas }}"; fi
          python3 tools/announce.py diff/old-releases.json diff/releases.json $F
